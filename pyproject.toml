[project]
name = "healthrisk-ai"
version = "0.1.0"
description = "Healthcare and financial risk intelligence platform"
requires-python = ">=3.10"
dependencies = [
    "pandas",
    "numpy",
    "scipy",
    "scikit-learn",
    "statsmodels",
    "matplotlib",
    "seaborn",
    "plotly",
    "xgboost",
    "lightgbm",
    "fastapi",
    "uvicorn",
    "jinja2",
    "shap",
    "pydantic"
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "jupyter",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = [
    "--cov=src/healthrisk",
    "--cov-report=term-missing",
    "--cov-report=html"
]

[tool.pyright]
extraPaths = ["."]