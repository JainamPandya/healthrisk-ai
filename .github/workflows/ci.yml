name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest pytest-cov httpx networkx

      - name: Run tests with coverage
        env:
          PYTHONPATH: .
        run: |
          python -m pytest tests/ -v --cov=src/healthrisk --cov=financial --cov=models --cov=simulation --cov-report=term-missing
